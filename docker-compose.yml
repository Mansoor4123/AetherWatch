version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: aetherwatch-db
    environment:
      POSTGRES_USER: aetherwatch
      POSTGRES_PASSWORD: aetherwatch
      POSTGRES_DB: aetherwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

